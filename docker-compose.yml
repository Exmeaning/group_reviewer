version: "3.9"

services:
  # ── 进群审核 Bot ─────────────────────────────────────────────
  group-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: group-reviewer:latest
    container_name: group-reviewer
    restart: unless-stopped

    environment:
      # WebSocket 模式：client (正向) 或 server (反向，默认)
      WS_MODE: "server"
      # 反向模式监听端口
      WS_PORT: "6700"
      WS_TOKEN: ""                    # 若设置了 access_token 填在这里
      BOT_NICK: "Reviewer"
      CMD_PREFIX: "/"
      SUPER_USERS: "你的QQ号"         # 多个用逗号分隔，如 "123456,789012"
      TZ: "Asia/Shanghai"
      LOG_LEVEL: "info"

    # 反向 WS 端口：让 OneBot 客户端连接
    ports:
      - "6700:6700"

    networks:
      - bot-net

    # 挂载日志目录（可选）
    volumes:
      - ./logs:/app/logs

    # 健康检查失败时自动重启
    healthcheck:
      test: ["CMD", "/app/group_reviewer", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  bot-net:
    driver: bridge
